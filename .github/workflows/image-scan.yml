name: Image scan

# Scans the binary inside the published Docker image of the latest release.
# The CI govulncheck job only scans source on main, so it cannot see
# vulnerabilities baked into images that were built with an older toolchain.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan (e.g. v0.1.1). Defaults to the latest release."
        required: false

jobs:
  scan:
    name: Scan published image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Resolve image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}"
          test -n "$tag" || { echo "No release found" >&2; exit 1; }
          repo="${GITHUB_REPOSITORY,,}"
          # Release workflow publishes semver tags without the leading "v".
          echo "ref=ghcr.io/${repo}:${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Scanning ghcr.io/${repo}:${tag#v}"

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker pull "$IMAGE"
          id=$(docker create "$IMAGE")
          docker cp "$id:/dyndns" ./dyndns
          docker rm "$id"
          echo "Embedded Go toolchain and modules:"
          go version -m ./dyndns

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -mode=binary ./dyndns
